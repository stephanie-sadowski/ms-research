[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msr"
version = "0.1.0"
description = "Fetch and analyse public multiple sclerosis data for myelin repair research"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
analysis = ["anndata>=0.10", "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "h5py>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
